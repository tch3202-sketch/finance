<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桃園國際民俗舞社 - 經費收支系統</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(30,60,114,0.25);
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        .card {
            background: white;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: #2c3e50;
            border-left: 4px solid #3498db;
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #4a5568;
        }

        input, select, textarea {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3498db;
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .type-btn {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
            user-select: none;
        }

        .type-btn.income.active {
            background-color: #2ec4b6;
            color: white;
            border-color: #2ec4b6;
        }

        .type-btn.expense.active {
            background-color: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(52,152,219,0.2);
        }

        button.submit-btn:active {
            background-color: #217dbb;
        }

        button.submit-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .history-list {
            margin-top: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5px;
            border-bottom: 1px solid #edf2f7;
            gap: 10px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            word-break: break-word;
        }

        .item-meta {
            font-size: 12px;
            color: #718096;
            word-break: break-word;
        }

        .item-amount {
            font-weight: bold;
            font-size: 17px;
            white-space: nowrap;
        }

        .item-amount.income {
            color: #2ec4b6;
        }

        .item-amount.expense {
            color: #e74c3c;
        }

        .status-toast {
            text-align: center;
            font-size: 14px;
            color: #718096;
            padding: 5px;
        }

        .error-detail {
            margin-top: 8px;
            font-size: 12px;
            color: #e74c3c;
            word-break: break-word;
        }

        @media (max-width: 420px) {
            .filter-row {
                flex-direction: column;
                gap: 0;
            }

            .filter-row .form-group {
                margin-bottom: 12px;
            }

            .history-item {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <!-- 結餘看板 -->
    <div class="balance-card">
        <div class="balance-label">📊 目前社費結餘</div>
        <div class="balance-amount" id="balanceDisplay">$0</div>
    </div>

    <!-- 記帳表單 -->
    <div class="card">
        <h2>✍️ 新增收支明細</h2>

        <div class="type-selector">
            <div class="type-btn income active" onclick="setRecordType('收入')">
                📥 收入
            </div>
            <div class="type-btn expense" onclick="setRecordType('支出')">
                📤 支出
            </div>
        </div>

        <div class="form-group">
            <label>選擇日期</label>
            <input type="date" id="recordDate">
        </div>

        <div class="form-group">
            <label id="reasonLabel">收費事由</label>
            <input type="text" id="recordReason"
                   placeholder="例如：第四季社費、贊助款...">
        </div>

        <div class="form-group" id="payerGroup">
            <label>繳款人</label>
            <select id="recordPayer">
                <option value="">-- 請選擇社員 --</option>
                <option value="非社員/其他">非社員 / 其他</option>
            </select>
        </div>

        <div class="form-group">
            <label>金額</label>
            <input type="number" id="recordAmount"
                   inputmode="numeric"
                   min="0"
                   step="1"
                   placeholder="請輸入金額">
        </div>

        <div class="form-group">
            <label>備註 (選填)</label>
            <input type="text" id="recordNote"
                   placeholder="如有其他補充說明...">
        </div>

        <button class="submit-btn" id="submitButton" onclick="submitRecord()">
            儲存並上傳紀錄
        </button>

        <div id="submitStatus"
             class="status-toast"
             style="margin-top:10px; display:none;">
        </div>
    </div>

    <!-- 日期區間檢索 -->
    <div class="card">
        <h2>🔍 依日期區間檢索細目</h2>

        <div class="filter-row">
            <div class="form-group">
                <label>起始日期</label>
                <input type="date" id="startDate" onchange="filterData()">
            </div>

            <div class="form-group">
                <label>結束日期</label>
                <input type="date" id="endDate" onchange="filterData()">
            </div>
        </div>

        <div id="filterStatus" class="status-toast">
            正在連線資料庫...
        </div>

        <div class="history-list" id="historyList"></div>
    </div>

</div>

<script>
    /*
     * =========================================================
     * Google Apps Script Web App 網址
     * =========================================================
     */
    const WEB_APP_URL =
        'https://script.google.com/macros/s/AKfycbzbXGa91-In2P8--N6WC7ecL81heTNancM4vJv0HsRaLVs8ev82AWAHNuv0QyWLXnKE/exec';

    let currentType = '收入';
    let fullHistoryData = [];

    /*
     * =========================================================
     * 網頁載入
     * =========================================================
     */
    window.onload = function () {

        // 今天
        const today = getLocalDateString();

        document.getElementById('recordDate').value = today;
        document.getElementById('endDate').value = today;

        // 本月第一天
        const now = new Date();
        const firstDay =
            `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;

        document.getElementById('startDate').value = firstDay;

        // 開始讀取 Google 試算表
        fetchDataFromSheet();
    };


    /*
     * =========================================================
     * 取得本地日期，避免 toISOString() 造成時區日期偏移
     * =========================================================
     */
    function getLocalDateString() {

        const date = new Date();

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');

        return `${year}-${month}-${day}`;
    }


    /*
     * =========================================================
     * 收入 / 支出切換
     * =========================================================
     */
    function setRecordType(type) {

        currentType = type;

        const incBtn = document.querySelector('.type-btn.income');
        const expBtn = document.querySelector('.type-btn.expense');
        const payerGroup = document.getElementById('payerGroup');
        const reasonLabel = document.getElementById('reasonLabel');

        if (type === '收入') {

            incBtn.classList.add('active');
            expBtn.classList.remove('active');

            payerGroup.style.display = 'flex';
            reasonLabel.innerText = '收費事由';

        } else {

            incBtn.classList.remove('active');
            expBtn.classList.add('active');

            payerGroup.style.display = 'none';
            reasonLabel.innerText = '支出事由';
        }
    }


    /*
     * =========================================================
     * 從 Google Apps Script 讀取資料
     *
     * 使用 JSONP：
     * /exec?action=getData&callback=xxxxx
     *
     * 前提：
     * Google Apps Script 的 doGet() 必須支援 callback。
     * =========================================================
     */
    function fetchDataFromSheet() {

        const status =
            document.getElementById('filterStatus');

        status.innerText =
            '正在同步資料庫最新資訊...';

        const callbackName =
            'jsonp_' + Date.now() + '_' +
            Math.floor(Math.random() * 100000);

        let script = document.createElement('script');

        let finished = false;

        // Google 回傳資料後執行
        window[callbackName] = function (result) {

            if (finished) return;

            finished = true;

            try {

                if (!result) {
                    throw new Error('Google Apps Script 沒有回傳資料');
                }

                if (result.status === 'error') {
                    throw new Error(
                        result.message || 'Google Apps Script 回傳錯誤'
                    );
                }

                // -------------------------
                // 結餘
                // -------------------------
                const balance =
                    Number(result.balance || 0);

                document.getElementById('balanceDisplay').innerText =
                    `$${balance.toLocaleString('zh-TW')}`;

                // -------------------------
                // 社員名單
                // -------------------------
                updateMemberDropdown(
                    Array.isArray(result.members)
                        ? result.members
                        : []
                );

                // -------------------------
                // 歷史紀錄
                // -------------------------
                fullHistoryData =
                    Array.isArray(result.history)
                        ? result.history
                        : [];

                filterData();

                status.innerText =
                    '📊 連線完成';

            } catch (error) {

                console.error(
                    'Google 資料處理錯誤：',
                    error
                );

                status.innerText =
                    '❌ Google 資料格式錯誤';

                showErrorDetail(error.message);
            }

            cleanupJsonp();
        };


        /*
         * Google JSONP 網址
         */
        const separator =
            WEB_APP_URL.includes('?') ? '&' : '?';

        script.src =
            `${WEB_APP_URL}${separator}` +
            `action=getData&callback=${encodeURIComponent(callbackName)}`;


        /*
         * 載入失敗
         */
        script.onerror = function () {

            if (finished) return;

            finished = true;

            status.innerText =
                '❌ 無法與 Google 試算表建立連線';

            showErrorDetail(
                '請檢查 Google Apps Script 網頁應用程式網址、部署權限，以及 doGet() 是否支援 JSONP。'
            );

            cleanupJsonp();
        };


        /*
         * 超時
         */
        const timeoutId = setTimeout(function () {

            if (finished) return;

            finished = true;

            status.innerText =
                '❌ Google 試算表連線逾時';

            showErrorDetail(
                'Google Apps Script 在 15 秒內沒有回應。'
            );

            cleanupJsonp();

        }, 15000);


        function cleanupJsonp() {

            clearTimeout(timeoutId);

            if (script && script.parentNode) {
                script.parentNode.removeChild(script);
            }

            delete window[callbackName];
        }


        document.body.appendChild(script);
    }


    /*
     * =========================================================
     * 顯示錯誤細節
     * =========================================================
     */
    function showErrorDetail(message) {

        let old =
            document.getElementById('errorDetail');

        if (!old) {

            old = document.createElement('div');
            old.id = 'errorDetail';
            old.className = 'error-detail';

            document
                .getElementById('filterStatus')
                .parentNode
                .appendChild(old);
        }

        old.innerText = message || '';
    }


    /*
     * =========================================================
     * 更新社員下拉選單
     * =========================================================
     */
    function updateMemberDropdown(members) {

        const selectElement =
            document.getElementById('recordPayer');

        selectElement.innerHTML =
            '<option value="">-- 請選擇社員 --</option>';

        if (Array.isArray(members)) {

            members.forEach(function (name) {

                if (name === null ||
                    name === undefined ||
                    String(name).trim() === '') {
                    return;
                }

                const option =
                    document.createElement('option');

                option.value = String(name);
                option.innerText = String(name);

                selectElement.appendChild(option);
            });
        }

        const otherOption =
            document.createElement('option');

        otherOption.value =
            '非社員/其他';

        otherOption.innerText =
            '非社員 / 其他';

        selectElement.appendChild(otherOption);
    }


    /*
     * =========================================================
     * 日期區間篩選
     * =========================================================
     */
    function filterData() {

        const start =
            document.getElementById('startDate').value;

        const end =
            document.getElementById('endDate').value;

        const listArea =
            document.getElementById('historyList');

        if (!start || !end) {
            return;
        }

        if (start > end) {

            listArea.innerHTML =
                '<div class="status-toast">⚠️ 起始日期不能晚於結束日期。</div>';

            document.getElementById('filterStatus').innerText =
                '日期範圍錯誤';

            return;
        }

        const filtered =
            fullHistoryData.filter(function (item) {

                const itemDate =
                    normalizeDate(item.date);

                return itemDate >= start &&
                       itemDate <= end;
            });


        if (filtered.length === 0) {

            listArea.innerHTML =
                '<div class="status-toast">' +
                '此日期區間內暫無收支細目。' +
                '</div>';

            document.getElementById('filterStatus').innerText =
                '查詢完成';

            return;
        }


        let html = '';

        filtered.forEach(function (item) {

            const isIncome =
                String(item.type) === '收入';

            const sign =
                isIncome ? '+' : '-';

            const amount =
                Number(item.amount || 0);

            const payerInfo =
                (isIncome && item.payer)
                    ? ` ➔ 繳款人: ${escapeHtml(item.payer)}`
                    : '';

            const noteInfo =
                item.note
                    ? ` (${escapeHtml(item.note)})`
                    : '';

            const reason =
                escapeHtml(item.reason || '');

            const date =
                escapeHtml(
                    normalizeDate(item.date)
                );


            html += `
                <div class="history-item">

                    <div class="item-left">

                        <div class="item-title">
                            ${reason}${noteInfo}
                        </div>

                        <div class="item-meta">
                            📅 ${date}${payerInfo}
                        </div>

                    </div>

                    <div class="item-amount ${isIncome ? 'income' : 'expense'}">
                        ${sign}$${amount.toLocaleString('zh-TW')}
                    </div>

                </div>
            `;
        });


        listArea.innerHTML = html;

        document.getElementById('filterStatus').innerText =
            `📊 已檢索到 ${filtered.length} 筆明細`;
    }


    /*
     * =========================================================
     * 日期格式整理
     * =========================================================
     */
    function normalizeDate(value) {

        if (!value) return '';

        // 已經是 YYYY-MM-DD
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
            return String(value);
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return String(value);
        }

        const year =
            date.getFullYear();

        const month =
            String(date.getMonth() + 1).padStart(2, '0');

        const day =
            String(date.getDate()).padStart(2, '0');

        return `${year}-${month}-${day}`;
    }


    /*
     * =========================================================
     * HTML 安全處理
     * =========================================================
     */
    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    /*
     * =========================================================
     * 新增收支紀錄
     *
     * 注意：
     * 這裡仍然使用原本的 POST API。
     * Google Apps Script 後端必須有 doPost(e)。
     * =========================================================
     */
    async function submitRecord() {

        const date =
            document.getElementById('recordDate').value;

        const reason =
            document.getElementById('recordReason').value.trim();

        const payer =
            document.getElementById('recordPayer').value;

        const amount =
            parseFloat(
                document.getElementById('recordAmount').value
            );

        const note =
            document.getElementById('recordNote').value.trim();

        const statusBox =
            document.getElementById('submitStatus');

        const submitButton =
            document.getElementById('submitButton');


        // -------------------------
        // 基本檢查
        // -------------------------
        if (!date ||
            !reason ||
            isNaN(amount) ||
            amount <= 0) {

            alert(
                '請完整填寫日期、事由及正確的金額！'
            );

            return;
        }


        if (currentType === '收入' && !payer) {

            alert('請選取繳款人！');

            return;
        }


        statusBox.style.display = 'block';
        statusBox.style.color = '#718096';

        statusBox.innerText =
            '⏳ 正在寫入雲端試算表...';

        submitButton.disabled = true;


        const payload = {

            date: date,

            type: currentType,

            reason: reason,

            payer:
                currentType === '收入'
                    ? payer
                    : '',

            amount: amount,

            note: note
        };


        try {

            const response =
                await fetch(WEB_APP_URL, {

                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'text/plain;charset=utf-8'
                    },

                    body:
                        JSON.stringify(payload)
                });


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const result =
                await response.json();


            if (result.status === 'success') {

                statusBox.innerText =
                    '✅ 紀錄上傳成功！';

                statusBox.style.color =
                    '#2ec4b6';


                // 清空表單
                document.getElementById(
                    'recordReason'
                ).value = '';

                document.getElementById(
                    'recordPayer'
                ).value = '';

                document.getElementById(
                    'recordAmount'
                ).value = '';

                document.getElementById(
                    'recordNote'
                ).value = '';


                // 重新讀取資料
                setTimeout(
                    fetchDataFromSheet,
                    500
                );


            } else {

                throw new Error(
                    result.message ||
                    'Google Apps Script 回傳失敗'
                );
            }


        } catch (error) {

            console.error(
                '上傳錯誤：',
                error
            );

            statusBox.innerText =
                '❌ 寫入失敗';

            statusBox.style.color =
                '#e74c3c';

            showErrorDetail(
                '上傳錯誤：' + error.message
            );

        } finally {

            submitButton.disabled = false;
        }
    }
</script>

</body>
</html>
