<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桃園國際民俗舞社 - 經費收支系統</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 600px; margin: auto; }
        
        /* 結餘大字卡 */
        .balance-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 25px 20px; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(30,60,114,0.25); margin-bottom: 20px; }
        .balance-label { font-size: 14px; opacity: 0.8; letter-spacing: 1px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin-top: 5px; }
        
        /* 區塊標準卡片 */
        .card { background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); margin-bottom: 20px; box-sizing: border-box; }
        h2 { font-size: 18px; margin: 0 0 15px 0; color: #2c3e50; border-left: 4px solid #3498db; padding-left: 8px; }
        
        /* 表單元素樣式 */
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { font-size: 14px; font-weight: 500; margin-bottom: 5px; color: #4a5568; }
        input, select, textarea { padding: 12px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; outline: none; background-color: #fff; }
        input:focus, select:focus { border-color: #3498db; }
        
        /* 收支單選按鈕樣式 */
        .type-selector { display: flex; gap: 10px; margin-bottom: 12px; }
        .type-btn { flex: 1; text-align: center; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-weight: bold; cursor: pointer; background: #fff; }
        .type-btn.income.active { background-color: #2ec4b6; color: white; border-color: #2ec4b6; }
        .type-btn.expense.active { background-color: #e74c3c; color: white; border-color: #e74c3c; }
        
        button.submit-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background-color: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 4px rgba(52,152,219,0.2); }
        button.submit-btn:active { background-color: #217dbb; }
        
        /* 日期區間檢索區 */
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-row .form-group { flex: 1; margin-bottom: 0; }
        
        /* 歷史明細明細項目 */
        .history-list { margin-top: 10px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid #edf2f7; }
        .history-item:last-child { border-bottom: none; }
        .item-left { display: flex; flex-direction: column; gap: 4px; }
        .item-title { font-weight: 600; font-size: 16px; }
        .item-meta { font-size: 12px; color: #718096; }
        .item-amount { font-weight: bold; font-size: 17px; }
        .item-amount.income { color: #2ec4b6; }
        .item-amount.expense { color: #e74c3c; }
        
        .status-toast { text-align: center; font-size: 14px; color: #718096; padding: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 結餘看版 -->
        <div class="balance-card">
            <div class="balance-label">📊 目前社費結餘</div>
            <div class="balance-amount" id="balanceDisplay">$0</div>
        </div>

        <!-- 記帳表單卡片 -->
        <div class="card">
            <h2>✍️ 新增收支明細</h2>
            <div class="type-selector">
                <div class="type-btn income active" onclick="setRecordType('收入')">📥 收入</div>
                <div class="type-btn expense" onclick="setRecordType('支出')">📤 支出</div>
            </div>
            
            <div class="form-group">
                <label>選擇日期</label>
                <input type="date" id="recordDate">
            </div>
            <div class="form-group">
                <label id="reasonLabel">收費事由</label>
                <input type="text" id="recordReason" placeholder="例如：第四季社費、贊助款...">
            </div>
            
            <!-- 【已改版】：繳款人現已改為動態下拉選單 -->
            <div class="form-group" id="payerGroup">
                <label>繳款人</label>
                <select id="recordPayer">
                    <option value="">-- 請選擇社員 --</option>
                    <!-- 社員名單將透過 JavaScript 動態載入至此 -->
                    <option value="非社員/其他">非社員 / 其他</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>金額</label>
                <input type="number" id="recordAmount" inputmode="numeric" placeholder="請輸入金額">
            </div>
            <div class="form-group">
                <label>備註 (選填)</label>
                <input type="text" id="recordNote" placeholder="如有其他補充說明...">
            </div>
            <button class="submit-btn" onclick="submitRecord()">儲存並上傳紀錄</button>
            <div id="submitStatus" class="status-toast" style="margin-top: 10px; display: none;"></div>
        </div>

        <!-- 區間檢索卡片 -->
        <div class="card">
            <h2>🔍 依日期區間檢索細目</h2>
            <div class="filter-row">
                <div class="form-group">
                    <label>起始日期</label>
                    <input type="date" id="startDate" onchange="filterData()">
                </div>
                <div class="form-group">
                    <label>結束日期</label>
                    <input type="date" id="endDate" onchange="filterData()">
                </div>
            </div>
            <div id="filterStatus" class="status-toast">連線資料庫中...</div>
            <div class="history-list" id="historyList">
                <!-- 檢索清單會渲染在此 -->
            </div>
        </div>
    </div>

    <script>
        // 💥 請在此替換為您從 Google Apps Script 複製來的網頁應用程式網址 💥
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx4y_GswAPHWk3mXxFACVcUvV46-gj_yVzkh2VNh4cGpBJ1N85V3OZqAJ4s8gbbJRLh/exec';
        
        let currentType = '收入';
        let fullHistoryData = []; 

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('recordDate').value = today;
            
            const date = new Date();
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];
            document.getElementById('startDate').value = firstDay;
            document.getElementById('endDate').value = today;

            fetchDataFromSheet();
        };

        function setRecordType(type) {
            currentType = type;
            const incBtn = document.querySelector('.type-btn.income');
            const expBtn = document.querySelector('.type-btn.expense');
            const payerGroup = document.getElementById('payerGroup');
            const reasonLabel = document.getElementById('reasonLabel');

            if (type === '收入') {
                incBtn.classList.add('active');
                expBtn.classList.remove('active');
                payerGroup.style.display = 'flex';
                reasonLabel.innerText = '收費事由';
            } else {
                incBtn.classList.remove('active');
                expBtn.classList.add('active');
                payerGroup.style.display = 'none'; 
                reasonLabel.innerText = '支出事由';
            }
        }

        // 從資料庫撈取結餘、明細，以及「新增的社員名單」
        async function fetchDataFromSheet() {
            document.getElementById('filterStatus').innerText = '正在同步資料庫最新資訊...';
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getData`);
                const result = await response.json();
                
                // 1. 渲染結餘
                document.getElementById('balanceDisplay').innerText = `$${result.balance.toLocaleString()}`;
                
                // 2. 動態更新社員下拉選單
                updateMemberDropdown(result.members);
                
                // 3. 渲染收支歷史紀錄
                fullHistoryData = result.history;
                filterData();
            } catch (error) {
                document.getElementById('filterStatus').innerText = '❌ 無法與雲端資料庫建立連線';
            }
        }

        // 新增：將後端傳來的名單塞入 Select 下拉選單中
        function updateMemberDropdown(members) {
            const selectElement = document.getElementById('recordPayer');
            
            // 保留預設的第一個選項與最後一個「其他」選項
            selectElement.innerHTML = '<option value="">-- 請選擇社員 --</option>';
            
            if (members && members.length > 0) {
                members.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.innerText = name;
                    selectElement.appendChild(option);
                });
            }
            
            // 補上最後的備用選項
            const otherOption = document.createElement('option');
            otherOption.value = '非社員/其他';
            otherOption.innerText = '非社員 / 其他';
            selectElement.appendChild(otherOption);
        }

        function filterData() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const listArea = document.getElementById('historyList');
            
            if (!start || !end) return;

            const filtered = fullHistoryData.filter(item => item.date >= start && item.date <= end);
            
            if (filtered.length === 0) {
                listArea.innerHTML = '<div class="status-toast">此日期區間內暫無收支細目。</div>';
                document.getElementById('filterStatus').innerText = '查詢完成';
                return;
            }

            let html = '';
            filtered.forEach(item => {
const isIncome = item.type === '收入';
const sign = isIncome ? '+' : '-';
const payerInfo = (isIncome && item.payer) ?  ➔ 繳款人: ${item.payer} : '';
const noteInfo = item.note ?  (${item.note}) : '';
html += <div class="history-item"> <div class="item-left"> <div class="item-title">${item.reason}${noteInfo}</div> <div class="item-meta">📅 ${item.date}${payerInfo}</div> </div> <div class="item-amount ${isIncome ? 'income' : 'expense'}"> ${sign}$${item.amount.toLocaleString()} </div> </div>;
});
listArea.innerHTML = html;
document.getElementById('filterStatus').innerText = 📊 已檢索到 ${filtered.length} 筆明細;
}
async function submitRecord() {
const date = document.getElementById('recordDate').value;
const reason = document.getElementById('recordReason').value.trim();
const payer = document.getElementById('recordPayer').value; // 👈 這裡拿到下拉選單選取的值
const amount = parseFloat(document.getElementById('recordAmount').value);
const note = document.getElementById('recordNote').value.trim();
const statusBox = document.getElementById('submitStatus');
if (!date || !reason || isNaN(amount) || amount <= 0) {
alert('請完整填寫日期、事由及正確的金額！');
return;
}
if (currentType === '收入' && !payer) {
alert('請選取繳款人！');
return;
}
statusBox.style.display = 'block';
statusBox.innerText = '⏳ 正在寫入雲端試算表...';
statusBox.style.color = '#718096';
const payload = {
date: date,
type: currentType,
reason: reason,
payer: currentType === '收入' ? payer : '',
amount: amount,
note: note
};
try {
const response = await fetch(WEB_APP_URL, {
method: 'POST',
body: JSON.stringify(payload)
});
const result = await response.json();
if (result.status === 'success') {
statusBox.innerText = '✅ 紀錄上傳成功！';
statusBox.style.color = '#2ec4b6';
document.getElementById('recordReason').value = '';
document.getElementById('recordPayer').value = ''; // 重置選單
document.getElementById('recordAmount').value = '';
document.getElementById('recordNote').value = '';
fetchDataFromSheet();
} else {
statusBox.innerText = '❌ 寫入失敗，請重新再試';
statusBox.style.color = '#e74c3c';
}
} catch (error) {
statusBox.innerText = '❌ 網路連線異常，上傳失敗';
statusBox.style.color = '#e74c3c';
}
}
